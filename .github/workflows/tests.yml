name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Outils optionnels (pdftotext)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Syntaxe PHP
        shell: bash
        run: |
          for f in $(find src public tests docs/tools -name '*.php') bin/poseidon bootstrap.php; do php -l "$f" > /dev/null || exit 1; done

      - name: Suite de tests
        run: php tests/run.php

      - name: Interface en ligne de commande
        shell: bash
        run: |
          php bin/poseidon demo
          php bin/poseidon info
          php bin/poseidon search samples/demo "contrat préavis" -l --no-warnings

      - name: Banc d'essai (1 000 fichiers)
        if: runner.os == 'Linux' && matrix.php == '8.4'
        run: php tests/bench.php 1000
